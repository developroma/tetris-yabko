<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yabko Arcade</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #212121;
            --accent: #f39c12;
            --btn-primary: #e67e22;
            --btn-secondary: #34495e;
            --text-color: #ecf0f1;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
        }

        .active { display: flex; }

        h1 { margin-bottom: 5px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; }
        .subtitle { font-size: 14px; color: #95a5a6; margin-bottom: 30px; }

        .menu-btn {
            background: #2c3e50;
            color: white;
            border: 2px solid #34495e;
            width: 100%;
            max-width: 280px;
            padding: 15px;
            margin: 8px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s, background 0.2s;
        }
        .menu-btn:active { transform: scale(0.98); background: #3e5871; }
        .menu-btn span.icon { font-size: 22px; }

        .profile-stats {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 280px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }
        .stat-item { text-align: center; }
        .stat-val { font-size: 20px; font-weight: bold; color: var(--accent); }
        .stat-lbl { font-size: 12px; color: #bdc3c7; }

        canvas {
            border: 2px solid #34495e;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-height: 60vh;
            width: auto;
        }

        .score-big { font-size: 48px; font-weight: bold; color: var(--accent); margin: 10px 0; }
        .score-label { font-size: 16px; color: #bdc3c7; }

        .action-btn {
            background: var(--btn-primary);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            margin-top: 20px;
            width: 80%;
            max-width: 250px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }
        .btn-secondary { background: var(--btn-secondary); box-shadow: none; margin-top: 10px; }

        #controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 260px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            height: 55px;
            font-size: 24px;
            color: white;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { background: rgba(255,255,255,0.3); }

    </style>
</head>
<body>

    <div id="screen-menu" class="screen active">
        <h1>Arcade Hall</h1>
        <div class="subtitle">Обери гру та встановлюй рекорди</div>

        <div class="profile-stats">
            <div class="stat-item">
                <div class="stat-val" id="menu-best-score">0</div>
                <div class="stat-lbl">Мій Рекорд</div>
            </div>
            <div class="stat-item">
                <div class="stat-val">User</div>
                <div class="stat-lbl">Гравець</div>
            </div>
        </div>

        <button class="menu-btn" onclick="startGame('classic')">
            <span>👾 Тетріс 2000</span>
            <span>▶</span>
        </button>
        
        <button class="menu-btn" onclick="showToast('Скоро буде!')" style="opacity: 0.6;">
            <span>🐍 Змійка</span>
            <span>🔒</span>
        </button>
        <button class="menu-btn" onclick="showToast('Скоро буде!')" style="opacity: 0.6;">
            <span>🏎️ Гонки</span>
            <span>🔒</span>
        </button>

        <div style="flex-grow: 1;"></div>
        <button class="menu-btn btn-secondary" onclick="closeApp()">
            <span>🔙 Вихід в бот</span>
        </button>
    </div>

    <div id="screen-game" class="screen">
        <div style="display: flex; justify-content: space-between; width: 240px; margin-bottom: 10px;">
            <span>Score: <b id="game-score">0</b></span>
            <span style="color: #e74c3c; cursor: pointer;" onclick="gameOver()">End</span>
        </div>
        <canvas id="tetris" width="240" height="400"></canvas>
        
        <div id="controls">
            <div></div>
            <div class="ctrl-btn" id="btn-rotate">↻</div>
            <div></div>
            <div class="ctrl-btn" id="btn-left">⬅️</div>
            <div class="ctrl-btn" id="btn-down">⬇️</div>
            <div class="ctrl-btn" id="btn-right">➡️</div>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <h2>GAME OVER</h2>
        <div class="score-label">Твій результат</div>
        <div class="score-big" id="result-score">0</div>
        
        <div class="score-label" id="new-record-label" style="color: #2ecc71; display: none;">🏆 Новий Рекорд!</div>

        <button class="action-btn" onclick="startGame('classic')">🔄 Зіграти ще раз</button>
        <button class="action-btn btn-secondary" onclick="goToMenu()">☰ Меню ігор</button>
        <button class="action-btn" style="background: #27ae60; margin-top: 30px;" onclick="saveAndExit()">💾 Зберегти і Вийти</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.disableVerticalSwipes();

    const urlParams = new URLSearchParams(window.location.search);
    let bestScore = parseInt(urlParams.get('best')) || 0;
    
    document.getElementById('menu-best-score').innerText = bestScore;

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goToMenu() {
        showScreen('screen-menu');
    }

    function closeApp() {
        tg.close();
    }

    function showToast(msg) {
        tg.showPopup({title: 'Info', message: msg});
    }

    function saveAndExit() {
        const data = JSON.stringify({
            score: player.score,
            type: 'classic'
        });
        tg.sendData(data);
    }

    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const arena = createMatrix(12, 20);
    const player = { pos: {x: 0, y: 0}, matrix: null, score: 0 };
    
    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isPaused = true;
    let animationId = null;

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function createPiece(type) {
        if (type === 'I') return [[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0],[0, 1, 0, 0]];
        if (type === 'L') return [[0, 2, 0],[0, 2, 0],[0, 2, 2]];
        if (type === 'J') return [[0, 3, 0],[0, 3, 0],[3, 3, 0]];
        if (type === 'O') return [[4, 4],[4, 4]];
        if (type === 'Z') return [[5, 5, 0],[0, 5, 5],[0, 0, 0]];
        if (type === 'S') return [[0, 6, 6],[6, 6, 0],[0, 0, 0]];
        if (type === 'T') return [[0, 7, 0],[7, 7, 7],[0, 0, 0]];
    }

    const colors = [null, '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];

    function draw() {
        context.fillStyle = '#000';
        context.fillRect(0, 0, canvas.width, canvas.height);
        drawMatrix(arena, {x: 0, y: 0});
        drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = colors[value];
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    context.lineWidth = 0.05;
                    context.strokeStyle = 'white';
                    context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
    }

    function merge(arena, player) {
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    arena[y + player.pos.y][x + player.pos.x] = value;
                }
            });
        });
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
                    return true;
                }
            }
        }
        return false;
    }

    function arenaSweep() {
        let rowCount = 1;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; ++x) {
                if (arena[y][x] === 0) continue outer;
            }
            const row = arena.splice(y, 1)[0].fill(0);
            arena.unshift(row);
            ++y;
            player.score += rowCount * 10;
            rowCount *= 2;
        }
        document.getElementById('game-score').innerText = player.score;
    }

    function playerReset() {
        const pieces = 'ILJOTSZ';
        player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
        player.pos.y = 0;
        player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
        if (collide(arena, player)) {
            gameOver();
        }
    }

    function playerDrop() {
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
        }
        dropCounter = 0;
    }

    function playerMove(dir) {
        player.pos.x += dir;
        if (collide(arena, player)) {
            player.pos.x -= dir;
        }
    }

    function playerRotate(dir) {
        const pos = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = pos;
                return;
            }
        }
    }

    function update(time = 0) {
        if (isPaused) return;
        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;
        if (dropCounter > dropInterval) {
            playerDrop();
        }
        draw();
        animationId = requestAnimationFrame(update);
    }

    function startGame(type) {
        arena.forEach(row => row.fill(0));
        player.score = 0;
        document.getElementById('game-score').innerText = '0';
        
        showScreen('screen-game');
        
        playerReset();
        isPaused = false;
        update();
    }

    function gameOver() {
        isPaused = true;
        cancelAnimationFrame(animationId);
        
        document.getElementById('result-score').innerText = player.score;
        
        if (player.score > bestScore) {
            bestScore = player.score;
            document.getElementById('new-record-label').style.display = 'block';
            document.getElementById('menu-best-score').innerText = bestScore;
        } else {
            document.getElementById('new-record-label').style.display = 'none';
        }

        showScreen('screen-result');
    }

    function bindBtn(id, action) {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); action(); }, {passive: false});
        btn.addEventListener('mousedown', (e) => { e.preventDefault(); action(); }); 
    }

    bindBtn('btn-left', () => playerMove(-1));
    bindBtn('btn-right', () => playerMove(1));
    bindBtn('btn-down', () => playerDrop());
    bindBtn('btn-rotate', () => playerRotate(1));

</script>
</body>
</html>
